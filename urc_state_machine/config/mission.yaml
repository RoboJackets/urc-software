nav_coordinator:
  ros__parameters:
    map_frame_id: map
    base_frame_id: base_link
    utm_frame_id: utm
    follower_action_name: navigate_to_waypoint
    mission_action_name: execute_autonomous_mission
    astronaut_action_name: execute_astronaut_mission
    waypoint_topic: /nav/waypoint
    gps_waypoint_topic: /waypoint
    state_topic: nav_coordinator_state
    command_topic: /command
    astronaut_pose_topic: /astronaut/pose
    aruco_topic: /aruco/detections
    cancel_on_new_waypoint: true
    tick_period: 0.1
    target_max_age: 2.0
    command_max_age: 2.0
    phase_timeout: 180.0
    recovery_timeout: 5.0
    max_retries: 1
    astronaut_arrival_radius: 3.0
    aruco_arrival_radius: 1.0
    follow_distance: 2.0
    aruco_standoff: 0.5
    goal_update_period: 1.0
    goal_update_distance: 0.5
    stationary_distance: 0.25
    stationary_duration: 2.0
    tool_placeholder_success: false
    tool_placeholder_duration: 1.0
