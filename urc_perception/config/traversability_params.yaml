grid_map_visualization:
  ros__parameters:
    grid_map_topic: /costmap
    grid_map_visualizations: [slope, traversability, traversability_inflated]

    slope:
      type: occupancy_grid
      params:
        layer: slope
        data_min: 0.0
        data_max: 1.57

    traversability:
      type: occupancy_grid
      params:
        layer: traversability
        data_min: 0.0
        data_max: 1.0
      publish_rate: 50

    traversability_inflated:
      type: occupancy_grid
      params:
        layer: traversability_inflated
        data_min: 0.0
        data_max: 1.0

traversability_mapping:
  ros__parameters:
    map_frame: map
    odometry_topic: /slam/odometry
    pointcloud_topic: /slam/map_points
    output_map_topic: /costmap
    filter_chain_parameter_name: filters
    cache_size_x: 10.0
    cache_size_y: 10.0
    resolution: 0.25
    # Input points kept beyond the window edge, covering the filter radii
    crop_margin_m: 0.75

    filters:
      filter1:
        name: buffer_normalizer
        type: gridMapFilters/BufferNormalizerFilter

      filter2: # Reduce noise with a radial blurring filter.
        name: mean_in_radius
        type: gridMapFilters/MeanInRadiusFilter
        params:
          input_layer: elevation
          output_layer: elevation_smooth
          radius: 0.5

      filter3: # Compute surface normals.
        name: surface_normals
        type: gridMapFilters/NormalVectorsFilter
        params:
          input_layer: elevation
          output_layers_prefix: normal_vectors_
          radius: 0.5
          normal_vector_positive_axis: z

      filter4: # Compute slope from surface normal.
        name: slope
        type: gridMapFilters/MathExpressionFilter
        params:
          output_layer: slope
          expression: acos(normal_vectors_z)

      filter5: # Compute roughness as absolute difference from map to smoothened map.
        name: roughness
        type: gridMapFilters/MathExpressionFilter
        params:
          output_layer: roughness
          expression: abs(elevation - elevation_smooth)

      filter6: # Score 0..1 (1 = lethal) against the rover's terrain limits.
        name: traversability
        type: urcPerception/TraversabilityCostFilter
        params:
          elevation_layer: elevation
          slope_layer: slope
          roughness_layer: roughness
          step_layer: step_height
          output_layer: traversability
          # Preserves the previous slope-only lethal point (0.5 rad, about 29 deg)
          max_slope_rad: 0.5
          # Provisional: not yet derived from rover testing; wheel radius is 0.12 m
          max_roughness_m: 0.15
          max_step_height_m: 0.15

      filter7: # Inflate lethal cells by the rover footprint.
        name: footprint_inflation
        type: urcPerception/FootprintInflationFilter
        params:
          input_layer: traversability
          output_layer: traversability_inflated
          lethal_cost: 1.0
          # Outer wheel edge from the URDF: 0.281 m wheel offset + half the 0.076 m wheel width
          inscribed_radius_m: 0.32
          inflation_radius_m: 0.75
          cost_scaling_per_m: 5.0
