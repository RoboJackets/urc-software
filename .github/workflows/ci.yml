name: CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          [[ -n "${base}" ]] || exit 0
          git diff --check "${base}" HEAD

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build lint image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: lint
          load: true
          tags: urc-lint:ci
          cache-from: type=gha,scope=lint
          cache-to: type=gha,scope=lint,mode=max

      - name: Run linters
        run: |
          docker run --rm -v "$PWD":/ws -w /ws urc-lint:ci bash -e -o pipefail -c '
            source /opt/ros/humble/setup.bash
            ament_uncrustify -c ament_code_style.cfg
            ament_flake8
            ament_xmllint
            ament_lint_cmake
          '

  build:
    name: Build and Test
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ci
          load: true
          tags: urc-ci:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache-ci
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Build and test
        run: |
          mkdir -p ~/.ccache-ci
          docker run --rm \
            -v "$PWD":/ws/src \
            -v ~/.ccache-ci:/ccache \
            urc-ci:ci bash -e -o pipefail -c '
              source /opt/ros/humble/setup.bash
              colcon build \
                --event-handlers console_cohesion+ \
                --cmake-args \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                  -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
              ccache --show-stats
              source install/setup.bash
              colcon test --event-handlers console_direct+ \
                --packages-skip nanopb vectornav vectornav_msgs \
                  behaviortree_ros2 btcpp_ros2_interfaces btcpp_ros2_samples
              colcon test-result --verbose
            '

  ci-success:
    name: CI Success
    if: always()
    needs: [lint, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require all jobs to pass
        run: |
          [[ "${{ needs.lint.result }}" == "success" && "${{ needs.build.result }}" == "success" ]]
