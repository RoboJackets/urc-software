follower_action_server:
  ros__parameters:
    trajectory_controller: "lqr"
    lookahead_distance: 0.75
    desired_linear_velocity: 0.25
    max_angular_velocity: 1.0
    heading_alignment_tolerance: 0.6
    enable_swerve_motion: true
    # Matches urc_perception, where 1.0 means lethal; compared with >=
    lethal_cost_threshold: 1.0
    cmd_vel_stamped: false
    cmd_vel_topic: "/cmd_vel"
    map_frame: "map"
    base_link_frame: "base_link"
    costmap_layer: "traversability_inflated"
    goal_tolerance: 0.1
    enforce_goal_heading: false
    goal_heading_tolerance: 0.1
    control_period: 0.1
    lqr_max_lateral_error: 0.1
    lqr_max_heading_error: 0.2
    lqr_max_angular_correction: 0.5
