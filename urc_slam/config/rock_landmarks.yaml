# Proposed parameters for the rock-landmark pipeline. NOT loaded by anything yet:
# slam_node does not declare these (see REVIEW_NOTES.md, "Required changes").
# Merge under slam_node.ros__parameters in slam_params.yaml when wiring in.
rock_landmarks:
  extractor:
    min_range_m: 1.0
    max_range_m: 30.0
    ground_cell_size_m: 0.5
    ground_clearance_m: 0.10
    cluster_tolerance_m: 0.15
    min_points: 20
    max_points: 20000
    min_radius_m: 0.1
    max_radius_m: 1.0
    max_height_m: 1.5
    max_sphere_rms_m: 0.05
  noise:
    # From the simulated LiDAR Monte Carlo; see slam_params.yaml.
    range_sigma_m: 0.085
    bearing_sigma_rad: 0.028
  associator:
    gate_confidence: 0.99
    recently_seen_window_poses: 10
    min_pairings_for_reassociation: 2
    ambiguity_margin: 2.0
    max_search_nodes: 20000
  huber_kernel_width: 1.345
