slam_node:
  ros__parameters:
    use_sim_time: true
    wheel_odom_topic: /odom
    wheel_odometry:
      frame: odom
      time_tolerance_sec: 0.1
      translation_sigma_m: 1.0
      yaw_sigma_rad: 1.0
      velocity_sigmas_mps: [1.0, 1.0]
    imu_topic: /imu/fused
    lidar_topic: /scan/points
    gps_topic: /slam/gps_odometry
    slam_odom_topic: /slam/odometry
    path_topic: /slam/path
    map_topic: /slam/map_points

    map_frame: map
    base_link_frame: base_link
    # Disable if another node (e.g. an EKF) already parents base_link
    publish_tf: true

    keyframe:
      translation_threshold_m: 0.5
      rotation_threshold_rad: 0.174533
      maximum_interval_s: 2.0

    # Landmark positions as rviz markers (spheres + labels), in map_frame.
    landmark_topic: /slam/landmarks
    # Rocks extracted from the latest keyframe sweep, in the LiDAR frame.
    rock_detection_topic: /slam/rock_detections

    # Rock landmark loop closure. Off in code unless enabled here (see REVIEW_NOTES.md).
    rock_landmarks:
      enabled: true
      noise:
        # RMS centre error (bias included) of all sphere-fit detections in the
        # simulated 16-beam LiDAR Monte Carlo (3.92 M sweeps, no centroid
        # fallback). Error did not track rock size or range, so no scaling.
        range_sigma_m: 0.085
        # Azimuth and elevation share one sigma (Unit3 factor). Measured RMS:
        # azimuth 0.0093 rad, elevation 0.028 rad; the larger is used so the
        # vertical error is not over-trusted.
        bearing_sigma_rad: 0.028
      # Remaining keys (extractor.*, associator.*, huber_kernel_width) use the
      # defaults in rock_landmark_params.hpp; override here to tune.

    # Revisit detection: GICP against earlier keyframes near the current pose,
    # accepted only if the fit is good and agrees with the graph's uncertainty.
    # Off by default; thresholds are untuned heuristics (see REVIEW_NOTES.md).
    loop_closure:
      enabled: false

    lidar_frontend:
      voxel_size_m: 0.2
      minimum_range_m: 1.0
      maximum_range_m: 80.0
      maximum_correspondence_distance_m: 2.0
      maximum_iterations: 64
      transformation_epsilon: 1.0e-6
      # Sparse 16-beam scans give correct alignments up to ~0.45 m^2; wrong
      # alignments show up as a low inlier fraction (~0.4)
      maximum_fitness_score_m2: 0.5
      minimum_inlier_fraction: 0.8

    registration:
      submap_keyframes: 3
      maximum_consecutive_failures: 3

    lidar_factor:
      rotation_sigma_rad: 0.05
      translation_sigma_m: 0.1

    prior:
      pose_rotation_sigma_rad: 0.1
      pose_translation_sigma_m: 0.1
      velocity_sigma_mps: 1.0
      accelerometer_bias_sigma_mps2: 0.1
      gyroscope_bias_sigma_radps: 0.01

    imu:
      # Noise densities measured from chassis vibration in simulation; re-derive
      # from logged data (e.g. Allan variance) on hardware
      accelerometer_noise_sigma: 0.25
      gyroscope_noise_sigma: 0.03
      integration_noise_sigma: 1.0e-4
      accelerometer_bias_random_walk_sigma: 1.0e-4
      gyroscope_bias_random_walk_sigma: 1.0e-4
      gravity_mps2: 9.8
      maximum_gap_s: 0.1

    gps:
      # Half the GPS period, so every keyframe gets its nearest fix
      time_tolerance_s: 0.25

    map:
      voxel_size_m: 0.2
      publish_period_s: 1.0

slam_navsat_transform:
  ros__parameters:
    use_sim_time: true
    frequency: 10.0
    delay: 0.0
    zero_altitude: false
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    use_odometry_yaw: false
    wait_for_datum: false
    publish_filtered_gps: false
    broadcast_utm_transform: false
    broadcast_cartesian_transform: false