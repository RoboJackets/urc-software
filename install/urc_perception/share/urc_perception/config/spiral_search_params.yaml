spiral_search_server:
  ros__parameters:
    map_frame: map
    waypoint_spacing: 0.5
    camera_horizontal_fov_degrees: 87.0
    max_detection_range: 3.0
    coverage_overlap_fraction: 0.5
    max_waypoints: 2000
    track_spacing: 0.0
    start_radius: 0.0

    # Must match traversability_mapping's output_map_topic in traversability_params.yaml.
    traversability_map_topic: /costmap
    # traversability_inflated is 0 on safe ground and at least ~0.09 within the Gaussian
    # radius of any cell the slope filters flagged, so 0.05 keeps that whole margin clear.
    traversability_cost_layer: traversability_inflated
    max_traversability_cost: 0.05
    # The inflated layer is 0 rather than NaN on unobserved cells, so unknown terrain is read
    # from the un-inflated layer.
    traversability_validity_layer: traversability
    allow_unknown_terrain: false

    max_map_age: 2.0
    require_traversability_map: true
